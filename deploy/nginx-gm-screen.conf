# GM-экран на smoreg.dev — статика под простейшим логином/паролем (owner-gated).
#
# На прод едет ТОЛЬКО статика экрана (web/), без ANTHROPIC_API_KEY и без go-сервера:
# разбор чарников делается локально скиллом parsing-character-sheets, на экран вставляется
# готовый JSON. Значит платной ручки /api здесь нет — авторизация нужна лишь чтобы экран
# был «для своих» (мастер + игроки), а не открыт всему интернету.
#
# Установка (по конвенции хоста: статика в /var/www/<name>, сниппет include'ится в server{}):
#   1) rsync -a web/ root@smoreg.dev:/var/www/gm-screen/
#   2) scp deploy/nginx-gm-screen.conf root@smoreg.dev:/etc/nginx/snippets/gm-screen.conf
#   3) завести пароли (см. ниже), nginx -t, systemctl reload nginx
#
# ⚠️ Пункты 2–3 меняют прод — выполнять только с явного разрешения владельца.
#
# --- Пароли (заводит ТОЛЬКО владелец — это и есть «рега с моего разрешения») ---
#   apt-get install -y apache2-utils        # даёт htpasswd, если его нет
#   htpasswd -B -c /etc/gm-screen/.htpasswd kirill    # ПЕРВЫЙ юзер (-c создаёт файл)
#   htpasswd -B    /etc/gm-screen/.htpasswd player1   # каждый следующий — БЕЗ -c
#   chown root:www-data /etc/gm-screen/.htpasswd && chmod 640 /etc/gm-screen/.htpasswd
# Снять доступ у игрока:  htpasswd -D /etc/gm-screen/.htpasswd player1
# Файл паролей — вне репозитория (репа публичная!), живёт только на хосте.

location = /gm-screen { return 301 /gm-screen/; }

location /gm-screen/ {
    alias /var/www/gm-screen/;
    index index.html;

    auth_basic           "GM-экран — вход для своих";
    auth_basic_user_file /etc/gm-screen/.htpasswd;

    # .html не кэшируем (обновляется при редеплое), остальное — можно
    location ~* \.html$ { add_header Cache-Control "no-cache"; }

    try_files $uri $uri/ =404;
}
